[project]
name = "file-service"
version = "0.1.0"
description = "Granthan File Service — upload, storage, metadata, and lifecycle management for GraphGPT files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "minio>=7.2.5",
    "aiokafka>=0.10.0",
    "filetype>=1.2.0",
    "structlog>=24.1.0",
    "pyjwt>=2.8.0",
    "clamd>=1.0.2",
    "prometheus-client>=0.20.0",
    "youtube-transcript-api>=1.2.4,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "testcontainers[postgres,kafka,minio]>=4.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
